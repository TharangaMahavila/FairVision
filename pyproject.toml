[project]
name = "fairface"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { email = "tharangamahavila@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "datasets>=5.1.0",
    "ipywidgets>=8.1.9",
    "matplotlib>=3.11.2",
    "notebook>=7.0",
    "numpy>=2.5.4",
    "pandas>=3.1.0",
    "pillow>=13.0.0",
    "scikit-learn>=1.9.1",
    "seaborn>=0.13.2",
    "streamlit>=1.66.1",
    "torch>=2.14.1",
    "torchvision>=0.29.1",
]

[project.scripts]
fairface = "fairface:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"
